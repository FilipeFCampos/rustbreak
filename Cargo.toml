[package]
name = "rustbreak"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
cursive = { version = "0.21.1", features = ["toml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version="1.18.1", features = ["v4"] }
